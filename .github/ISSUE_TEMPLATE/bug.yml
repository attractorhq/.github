name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the project. Do not report security issues here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag, or commit where you observed the problem.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and the smallest useful reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime version, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets and personal data before pasting logs.
      render: shell
